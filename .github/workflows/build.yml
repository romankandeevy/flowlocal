# Проверка на каждый push и PR: Swift-приложение собирается, бэкенд без
# синтаксических ошибок. Модели и окружение Python тут не ставим - это
# сотни мегабайт, для проверки сборки они не нужны.
name: сборка

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: swiftc
        working-directory: mac
        run: |
          xcrun swiftc -O -swift-version 5 -target "$(uname -m)-apple-macos14.0" \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            Sources/FlowLocal/*.swift -o FlowLocal \
            -framework AppKit -framework AVFoundation -framework Carbon -framework ApplicationServices

      - name: самопроверка логики
        working-directory: mac
        run: tools/selftest.sh

      - name: бэкенд
        working-directory: mac/backend
        run: python3 -m py_compile server.py langdetect.py
